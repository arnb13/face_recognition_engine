name: face_recognition_engine_example
description: Example usage of the face_recognition_engine package.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  face_recognition_engine:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Drop your MobileFaceNet .tflite into assets/ — see assets/README.md.
  # The directory is declared as a whole, so no pubspec edit is needed.
  assets:
    - assets/
