name: face_recognition_engine
description: >-
  On-device face recognition for Flutter using MobileFaceNet embeddings and
  cosine matching, with multi-angle enrollment storage and anti-spoofing hooks.
version: 1.0.3
repository: https://github.com/arnb13/face_recognition_engine
issue_tracker: https://github.com/arnb13/face_recognition_engine/issues
topics:
  - face-recognition
  - biometrics
  - machine-learning
  - tflite
  - camera

#screenshots:
#  - description: Identified dialog showing the matched person and similarity over the enrolled list.
#    path: screenshots/1-identified-result.jpg
#  - description: Guided enrollment — a live face box tracks the user while the prompt asks for the next pose.
#    path: screenshots/2-enroll-front.jpg
#  - description: Enrollment capture in progress — hold still while a turned pose is recorded.
#    path: screenshots/3-enroll-right.jpg
#  - description: Final enrollment angle captured; all three poses are stored as separate embeddings.
#    path: screenshots/4-enroll-left.jpg
#  - description: Liveness / anti-spoofing check on the live recognition screen, prompting a blink.
#    path: screenshots/5-liveness-check.jpg
#  - description: Live recognition rejecting an unenrolled face as Unknown with its best match score.
#    path: screenshots/6-live-detection.jpg

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.2
  image: ^4.9.1
  path_provider: ^2.1.4
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
# No model is bundled — the consuming app supplies the MobileFaceNet .tflite
# (as an asset or bytes). See the README "Model & license" section.
